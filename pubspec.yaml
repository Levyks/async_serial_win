name: async_serial_win
description: >
  Truly non-blocking, async Windows serial port I/O for Dart — backed by a
  Rust native library using overlapped Win32 I/O (no polling, no busy-wait).
version: 0.1.3
homepage: https://github.com/Levyks/async_serial_win
repository: https://github.com/Levyks/async_serial_win
issue_tracker: https://github.com/Levyks/async_serial_win/issues

platforms:
  windows:

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.1.3
  code_assets: '>=1.0.0 <2.0.0'
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
