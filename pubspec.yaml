name: async_serial_win
description: >
  Truly non-blocking, async Windows serial port I/O for Dart — backed by a
  Rust native library using overlapped Win32 I/O (no polling, no busy-wait).
version: 0.1.0
homepage: https://github.com/Levyks/async_serial_win

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.1.3
  code_assets: ^1.2.1
  hooks: ^2.0.2

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
